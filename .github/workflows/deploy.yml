name: Déploiement GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Builder le projet
        run: npm run build

      - name: Uploader le résultat du build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Notify Discord
        env:
            DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
            curl -H "Content-Type: application/json" \
              -d '{
                "embeds": [{
                  "title": "Déploiement GitHub Pages réussi",
                  "description": "Le site a été déployé avec succès sur GitHub Pages.",
                  "url": "${{ steps.deployment.outputs.page_url }}",
                  "color": 5814783,
                  "fields": [
                    {
                      "name": "Branche",
                      "value": "main",
                      "inline": true
                    },
                    {
                      "name": "Commit",
                      "value": "${{ github.sha }}",
                      "inline": true
                    }
                  ]
                }]
              }' \
              "$DISCORD_WEBHOOK_URL"

